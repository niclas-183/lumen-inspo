<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lumen · Inspo</title>
<style>
:root { --bg:#0c0d0b; --ink:#f3f0e8; --muted:#9a9689; --line:#2a2b26; --accent:#d8c7a1; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px}
form{width:100%;max-width:340px}
.eyebrow{color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:11px;margin:0 0 10px}
h1{font-family:ui-serif,Georgia,serif;font-weight:500;font-size:32px;margin:0 0 8px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 28px;font-size:14px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input{width:100%;background:#141512;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:15px;margin-bottom:14px}
input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
button{width:100%;appearance:none;border:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:12px 14px;font-size:14px;cursor:pointer;margin-top:6px}
button:disabled{opacity:.6;cursor:wait}
.err{color:#e07a6a;font-size:13px;min-height:1.2em;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
<form id="f" autocomplete="on">
<p class="eyebrow">Lumen</p>
<h1>Lumen inspo</h1>
<p>Internes Moodboard. Bitte einloggen.</p>
<label for="u">User</label>
<input id="u" name="username" autocomplete="username" autofocus>
<label for="p">Passwort</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<button type="submit" id="b">Enter</button>
<p class="err" id="e"></p>
</form>
</div>
<script>
const USER = "lumen";
const SKEY = "lumen-inspo-session";
const enc = new TextEncoder();
const dec = new TextDecoder();

async function deriveKey(password, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}

// Turn a "data:<mime>;base64,..." string into a blob: URL. data-full is only
// ever assigned to img.src, so the two are interchangeable there — but a blob
// keeps the screenshot out of the renderer's string heap, where the base64
// version stayed resident for the lifetime of the page.
function toBlobUrl(src){
  const comma = src.indexOf(",");
  if (comma < 0) return null;
  const meta = src.slice(5, comma);
  if (!/;base64$/.test(meta)) return null;
  const bin = atob(src.slice(comma + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], {type: meta.slice(0, -7) || "application/octet-stream"}));
}

// Deliberately runs after the gallery is on screen: converting earlier would
// hold the blobs and the base64 strings at the same time as the decrypt
// buffers and raise the peak we are trying to lower. One image per tick so
// the first scroll stays smooth.
async function shrinkScreenshots(){
  for (const img of document.querySelectorAll("img[data-full]")) {
    const full = img.dataset.full;
    if (full && full.slice(0, 5) === "data:") {
      try {
        const url = toBlobUrl(full);
        if (url) {
          img.dataset.full = url;
          if (img.getAttribute("src") === full) img.src = url;
        }
      } catch (e) {}
    }
    await new Promise(r => setTimeout(r, 0));
  }
}

function adopt(parsed){
  parsed.querySelectorAll("img").forEach(img => {
    const src = img.getAttribute("src");
    if (src) {
      if (!img.dataset.full) img.dataset.full = src;
      img.removeAttribute("src");
    }
  });
  document.title = parsed.title || "Lumen · Website inspiration";
  document.head.querySelectorAll("style, link[rel=stylesheet]").forEach(n => n.remove());
  parsed.head.querySelectorAll("style, link, meta[name], title").forEach(n => {
    document.head.appendChild(document.importNode(n, true));
  });
  const scripts = [...parsed.body.querySelectorAll("script")];
  scripts.forEach(s => s.remove());
  const nextBody = document.importNode(parsed.body, true);
  document.body.replaceWith(nextBody);
  scripts.forEach(old => {
    const s = document.createElement("script");
    s.textContent = old.textContent;
    document.body.appendChild(s);
  });
  shrinkScreenshots();
}

async function unlock(user, pass){
  if (user !== USER) throw new Error("auth");
  const res = await fetch("payload.bin", {cache: "force-cache"});
  if (!res.ok) throw new Error("payload");
  let buf = new Uint8Array(await res.arrayBuffer());
  if (dec.decode(buf.subarray(0,4)) !== "LIN1") throw new Error("format");
  const salt = buf.slice(4,20);
  const nonce = buf.slice(20,32);
  // subarray, not slice: slice would copy the whole 25 MB ciphertext.
  let ct = buf.subarray(32);
  const key = await deriveKey(pass, salt);
  let pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:nonce}, key, ct);
  // ct is a view into buf, so both have to go before the source buffer is freed.
  buf = null;
  ct = null;
  sessionStorage.setItem(SKEY, JSON.stringify({user, pass}));
  let html = dec.decode(pt);
  pt = null;
  // Parsed here rather than inside adopt() so the 25 MB string can be dropped
  // before the DOM work starts, instead of living until adopt() returns.
  let parsed = new DOMParser().parseFromString(html, "text/html");
  html = null;
  adopt(parsed);
  parsed = null;
}

const form = document.getElementById("f");
const err = document.getElementById("e");
const btn = document.getElementById("b");

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Öffne…";
  const user = document.getElementById("u").value.trim();
  const pass = document.getElementById("p").value;
  try {
    await unlock(user, pass);
  } catch (e) {
    sessionStorage.removeItem(SKEY);
    err.textContent = "Login stimmt nicht.";
    btn.disabled = false;
    btn.textContent = "Enter";
  }
});

try {
  const saved = JSON.parse(sessionStorage.getItem(SKEY) || "null");
  if (saved && saved.user && saved.pass) {
    btn.disabled = true;
    btn.textContent = "Öffne…";
    unlock(saved.user, saved.pass).catch(() => {
      sessionStorage.removeItem(SKEY);
      btn.disabled = false;
      btn.textContent = "Enter";
    });
  }
} catch (e) {}
</script>
</body></html>
