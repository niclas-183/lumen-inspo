<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lumen · Moodboard v2</title>
<style>
:root { --bg:#0c0d0b; --ink:#f3f0e8; --muted:#9a9689; --line:#2a2b26; --accent:#d8c7a1; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px}
form{width:100%;max-width:340px}
.eyebrow{color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:11px;margin:0 0 10px}
h1{font-family:ui-serif,Georgia,serif;font-weight:500;font-size:32px;margin:0 0 8px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 28px;font-size:14px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input{width:100%;background:#141512;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:15px;margin-bottom:14px}
input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
button{width:100%;appearance:none;border:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:12px 14px;font-size:14px;cursor:pointer;margin-top:6px}
button:disabled{opacity:.6;cursor:wait}
.err{color:#e07a6a;font-size:13px;min-height:1.2em;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
<form id="f" autocomplete="on">
<p class="eyebrow">Lumen</p>
<h1>Lumen Moodboard v2</h1>
<p>Internes Moodboard. Bitte einloggen.</p>
<label for="u">User</label>
<input id="u" name="username" autocomplete="username" autofocus>
<label for="p">Passwort</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<button type="submit" id="b">Enter</button>
<p class="err" id="e"></p>
</form>
</div>
<script>
const USER = "lumen";
const SKEY = "lumen-inspo-session";
const ASSET_V = "2026-08-26-v4nav";
const CHROME_KEY = "lumen-inspo-moodboard-v2-chrome";
const enc = new TextEncoder();
const dec = new TextDecoder();

async function deriveKey(password, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}

// A share link carries the payload's AES key in the URL fragment:
// index.html#k=<base64url>. The fragment is never sent to the server and is
// not included in the Referer header, so the key stays out of access logs and
// out of whatever the link is forwarded through.
function tokenFromUrl(){
  const m = /(?:^|[#&])k=([A-Za-z0-9_-]{43,})/.exec(location.hash || "");
  return m ? m[1] : null;
}

function b64urlBytes(s){
  const pad = s.length % 4;
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/") + (pad ? "=".repeat(4 - pad) : ""));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// The token IS the AES key, so there is no PBKDF2 to run and the salt is
// ignored. It is derived from the password but does not reveal it.
async function keyFromToken(token){
  const raw = b64urlBytes(token);
  if (raw.length !== 32) throw new Error("token");
  return crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["decrypt"]);
}

function toBlobUrl(src){
  const comma = src.indexOf(",");
  if (comma < 0) return null;
  const meta = src.slice(5, comma);
  if (!/;base64$/.test(meta)) return null;
  const bin = atob(src.slice(comma + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], {type: meta.slice(0, -7) || "application/octet-stream"}));
}

async function shrinkScreenshots(){
  const imgs = [...document.querySelectorAll("img[data-full]")];
  let i = 0;
  while (i < imgs.length) {
    const until = performance.now() + 8;
    while (i < imgs.length && performance.now() < until) {
      const img = imgs[i++];
      const full = img.dataset.full;
      if (full && full.slice(0, 5) === "data:") {
        try {
          const url = toBlobUrl(full);
          if (url) {
            img.dataset.full = url;
            if (img.getAttribute("src") === full) img.src = url;
          }
        } catch (e) {}
      }
    }
    await new Promise(r => setTimeout(r, 0));
  }
}

function diskHref(href){
  if (!href) return href;
  if (href.indexOf("styles.css") >= 0) return "styles.css?v=" + ASSET_V;
  if (href.indexOf("hero-dither.js") >= 0) return "hero-dither.js?v=" + ASSET_V;
  return href;
}

function svgIcon(d){
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "ic");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  svg.appendChild(path);
  return svg;
}

function makeChromeButton(id, className, label, expanded, pathD){
  const btn = document.createElement("button");
  btn.type = "button";
  btn.id = id;
  btn.className = className;
  btn.setAttribute("aria-label", label);
  btn.setAttribute("aria-expanded", expanded);
  btn.appendChild(svgIcon(pathD));
  return btn;
}

// Same idea as the root gallery ratings overlay: live Pages decrypts a
// stale payload.bin, so reviewer chrome that lives in app.html never
// arrives. Inject plus/minus if missing and point CSS/JS at disk.
function injectReviewerChrome(){
  try {
    if (localStorage.getItem(CHROME_KEY) === "collapsed") {
      document.documentElement.setAttribute("data-chrome", "collapsed");
    }
  } catch (e) {}

  const dock = document.querySelector(".mood-dock");
  if (!dock) return;

  if (!document.getElementById("chrome-expand")) {
    dock.parentNode.insertBefore(
      makeChromeButton(
        "chrome-expand",
        "chrome-toggle chrome-toggle-expand",
        "Steuerung aufklappen",
        "false",
        "M8 3.5v9M3.5 8h9"
      ),
      dock
    );
  }

  if (!document.getElementById("chrome-collapse")) {
    const firstCard = dock.querySelector(".mood-dock-card");
    if (!firstCard) return;
    let head = firstCard.querySelector(".mood-dock-head");
    const kicker = firstCard.querySelector(".mood-dock-kicker");
    if (!head) {
      head = document.createElement("div");
      head.className = "mood-dock-head";
      if (kicker) {
        firstCard.insertBefore(head, kicker);
        head.appendChild(kicker);
      } else {
        firstCard.insertBefore(head, firstCard.firstChild);
      }
    }
    head.appendChild(
      makeChromeButton(
        "chrome-collapse",
        "chrome-toggle chrome-toggle-collapse",
        "Steuerung einklappen",
        "true",
        "M3.5 8h9"
      )
    );
  }
}

function adopt(parsed){
  parsed.querySelectorAll("img").forEach(img => {
    const src = img.getAttribute("src");
    // Gallery payloads store screenshots as data: URIs; moodboard uses file
    // paths. Only strip data: so relative assets still load after unlock.
    if (src && src.slice(0, 5) === "data:") {
      if (!img.dataset.full) img.dataset.full = src;
      img.removeAttribute("src");
    }
  });
  document.title = parsed.title || "Lumen · Moodboard";
  document.head.querySelectorAll("style, link[rel=stylesheet]").forEach(n => n.remove());
  parsed.head.querySelectorAll("style, link, meta[name], title").forEach(n => {
    const node = document.importNode(n, true);
    if (node.tagName === "LINK") {
      const href = node.getAttribute("href");
      if (href) node.setAttribute("href", diskHref(href));
    }
    document.head.appendChild(node);
  });
  const scripts = [...parsed.body.querySelectorAll("script")];
  scripts.forEach(s => s.remove());
  const nextBody = document.importNode(parsed.body, true);
  document.body.replaceWith(nextBody);
  injectReviewerChrome();
  scripts.forEach(old => {
    const s = document.createElement("script");
    const src = old.getAttribute("src");
    s.async = false;
    if (src) s.src = diskHref(src);
    else s.textContent = old.textContent;
    document.body.appendChild(s);
  });
  shrinkScreenshots();
}

async function unlock(makeKey, session){
  const res = await fetch("payload.bin", {cache: "no-cache"});
  if (!res.ok) throw new Error("payload");
  let buf = new Uint8Array(await res.arrayBuffer());
  if (dec.decode(buf.subarray(0,4)) !== "LIN1") throw new Error("format");
  const salt = buf.slice(4,20);
  const nonce = buf.slice(20,32);
  let ct = buf.subarray(32);
  const key = await makeKey(salt);
  let pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:nonce}, key, ct);
  buf = null;
  ct = null;
  if (session) sessionStorage.setItem(SKEY, JSON.stringify(session));
  let html = dec.decode(pt);
  pt = null;
  let parsed = new DOMParser().parseFromString(html, "text/html");
  html = null;
  adopt(parsed);
  parsed = null;
  injectReviewerChrome();
}

const form = document.getElementById("f");
const err = document.getElementById("e");
const btn = document.getElementById("b");

function busy(on){
  btn.disabled = on;
  btn.textContent = on ? "Öffne…" : "Enter";
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.textContent = "";
  const user = document.getElementById("u").value.trim();
  const pass = document.getElementById("p").value;
  if (user !== USER) { err.textContent = "Login stimmt nicht."; return; }
  busy(true);
  try {
    await unlock(salt => deriveKey(pass, salt), {user, pass});
  } catch (e) {
    sessionStorage.removeItem(SKEY);
    err.textContent = "Login stimmt nicht.";
    busy(false);
  }
});

function boot(){
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch (e) {}
  const token = tokenFromUrl() || (saved && saved.token);
  if (token) {
    busy(true);
    unlock(() => keyFromToken(token), {token}).catch(() => {
      sessionStorage.removeItem(SKEY);
      err.textContent = "Dieser Link funktioniert nicht mehr.";
      busy(false);
    });
    return;
  }
  if (saved && saved.user && saved.pass) {
    busy(true);
    unlock(salt => deriveKey(saved.pass, salt), null).catch(() => {
      sessionStorage.removeItem(SKEY);
      busy(false);
    });
  }
}

boot();
</script>
</body></html>
