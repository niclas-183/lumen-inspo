<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Look-and-Feel fixture (not the gallery)</title>
<style>
:root { --bg:#0c0d0b; --ink:#f3f0e8; --muted:#9a9689; --line:#2a2b26; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,sans-serif}
nav{padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
main.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:18px}
article{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
h2{font-family:ui-serif,Georgia,serif;font-weight:500;margin:0;font-size:20px}
.why{color:var(--muted);margin:0;font-size:13px}
img{width:100%;height:120px;object-fit:cover;background:#1c1d19;border-radius:8px}
a{color:inherit}
</style>
<link rel="stylesheet" href="../ratings.css">
</head>
<body>
<nav>Fixture · sechs Fake-Karten, nicht das 150er-Archiv</nav>
<main class="wrap">
  <article>
    <h2><a href="https://linear.app/">Linear</a></h2>
    <p class="why">Issue tracking</p>
    <img alt="Linear" src="thumb.svg">
  </article>
  <article>
    <h2><a href="https://www.bevel.health/">Bevel</a></h2>
    <p class="why">Health coach</p>
    <img alt="Bevel" src="thumb.svg">
  </article>
  <article>
    <h2>Oura</h2>
    <p class="why">Ring</p>
    <img alt="Oura" src="thumb.svg">
  </article>
  <article>
    <h2><a href="https://www.whoop.com/us/en/">Whoop</a></h2>
    <p class="why">Band</p>
    <img alt="Whoop" src="thumb.svg">
  </article>
  <article>
    <h2>Clay Health</h2>
    <p class="why">Clinic</p>
    <img alt="Clay Health" src="thumb.svg">
  </article>
  <article>
    <h2>Clay</h2>
    <p class="why">GTM</p>
    <img alt="Clay" src="thumb.svg">
  </article>
</main>
<script>window.LUMEN_LOOKFEEL_CATALOG = "../stack.json";</script>
<script src="../ratings-core.js"></script>
<script src="../ratings.js"></script>
</body>
</html>
